{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7">
  <div class="card p-4">
    <h4 class="mb-3">Edit profile</h4>
    <form method="post">{% csrf_token %}
      {% for field in form %}
        <div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}
          {% if field.errors %}<div class="text-danger small">{{ field.errors.0 }}</div>{% endif %}</div>
      {% endfor %}
      <button class="btn btn-ll">Save changes</button>
      <a href="{% url 'profile' %}" class="btn btn-link">Cancel</a>
    </form>
  </div>
</div></div>
{% endblock %}
