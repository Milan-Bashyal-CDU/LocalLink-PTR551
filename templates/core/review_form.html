{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
  <div class="card p-4">
    <h4 class="mb-1">Leave a review</h4>
    <p class="text-muted">For {{ reviewee.get_full_name|default:reviewee.username }} on "{{ req.title }}"</p>
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label">Rating</label>{{ form.rating }}</div>
      <div class="mb-3"><label class="form-label">Comment</label>{{ form.comment }}</div>
      <button class="btn btn-ll">Submit review</button>
      <a href="{{ req.get_absolute_url }}" class="btn btn-link">Cancel</a>
    </form>
  </div>
</div></div>
{% endblock %}
